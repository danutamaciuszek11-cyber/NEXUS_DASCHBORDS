<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Cybernetic Grid Elements -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Central Nexus Book Emblem -->
  <g filter="url(#glow)">
    <!-- Left Book Wing -->
    <path d="M 256 160 C 210 130 140 135 110 145 C 100 148 94 156 94 166 L 94 340 C 94 350 102 358 112 356 C 140 348 205 342 256 370 Z" fill="url(#neonCyan)" fill-opacity="0.85" />
    
    <!-- Right Book Wing -->
    <path d="M 256 160 C 302 130 372 135 402 145 C 412 148 418 156 418 166 L 418 340 C 418 350 410 358 400 356 C 372 348 307 342 256 370 Z" fill="url(#neonPurple)" fill-opacity="0.85" />
    
    <!-- Spine Node -->
    <line x1="256" y1="150" x2="256" y2="380" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Quantum Core Crystal -->
    <polygon points="256,210 280,250 256,290 232,250" fill="#ffffff" filter="url(#glow)" />
    <circle cx="256" cy="250" r="4" fill="#00f0ff" />
  </g>

  <!-- Typography Nexus Emblem -->
  <text x="256" y="430" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="28" font-weight="900" letter-spacing="8">NEXUSBOOK</text>
  <text x="256" y="460" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="4">OFFLINE ARCHIVE</text>
</svg>
